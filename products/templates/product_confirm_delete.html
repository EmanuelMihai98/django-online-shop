<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmare Ștergere - Admin</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Cardul principal */
        .form-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 40px 50px;
            text-align: center;
        }
        .form-card h1 {
            font-size: 2.2em;
            color: #d9534f; /* Roșu pentru atenționare */
            margin-bottom: 20px;
        }
        .form-card p {
            font-size: 1.1em; 
            color: #555; 
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .form-card p strong {
            font-size: 1.2em; 
            color: #333;
            display: block;
            margin-top: 10px;
        }

        /* Container pentru butoane */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        /* Butoanele (din stilul tău) */
        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        
        /* Butonul roșu de ștergere */
        .btn-danger {
            background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(229, 57, 53, 0.3);
        }
        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(229, 57, 53, 0.5);
        }

        /* Butonul de anulare (secundar) */
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-secondary:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>🗑️ Ești sigur?</h1>
            <p>
                Ești pe cale să ștergi permanent acest produs.
                Acțiunea este ireversibilă.
                <strong>"{{ product.name }}"</strong>
            </p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="action-buttons">
                    <button type="submit" class="btn btn-danger">
                        Da, șterge
                    </button>
                    
                    <a href="{% url 'product_list_page' %}" class="btn btn-secondary">
                        Anulează
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
